
[package]
name = "svc-stream-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Framework gRPC de alta performance para Rust
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.35", features = ["full"] }

# Criptografia ultra rápida para o cálculo do SHA-256
sha2 = "0.10"

[build-dependencies]
# Compila o arquivo .proto automaticamente durante o "cargo build"
tonic-build = "0.11"
