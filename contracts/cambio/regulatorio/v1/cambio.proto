
syntax = "proto3";

package cambio.regulatorio.v1;

option go_package = "svc-agente-go/regulatorio/v1;regulatoriov1";

// O primeiro diálogo inteligente da API estruturado sob o padrão rigoroso
service RoteadorFiscalService {
  // Alterado para PascalCase puro sem sublinhado
  rpc ValidarERotearTransacao (ValidarERotearTransacaoRequest) returns (ValidarERotearTransacaoResponse);
}

message ValidarERotearTransacaoRequest {
  string transacao_id = 1;         
  string cnae_emissor = 2;         
  string cnpj_emissor = 3;         
  double valor_operacao_brl = 4;   
  string currency_destino_iso = 5;    
  
  double latitude_destino = 6;
  double longitude_destino = 7;

  string documento_fiscal_sha256 = 8;
  repeated float operacao_embedding = 9;
}

message ValidarERotearTransacaoResponse {
  string transacao_id = 1;
  bool conformidade_aprovada = 2;
  
  double aliquota_cbs_federal = 3;
  double aliquota_ibs_estadual = 4;
  double valor_imposto_retido_brl = 5;

  // Enumeração corrigida com os prefixos e o valor 0 UNSPECIFIED exigido pelo buf
  enum RailDestino {
    RAIL_DESTINO_REJEITADO_UNSPECIFIED = 0;
    RAIL_DESTINO_TRADICIONAL_HTTP2 = 1;   
    RAIL_DESTINO_DESCENTRALIZADO_WEB3 = 2; 
  }
  RailDestino rail_escolhido = 6;
  string hash_auditoria_estado = 7;
}
